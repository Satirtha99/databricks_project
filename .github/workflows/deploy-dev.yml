name: Deploy Databricks Bundle

on:
  push:
    branches:
      - dev
      - uat
      - prod

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy DAB to ${{ github.ref_name }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target ${{ github.ref_name }}

      - name: Deploy bundle
        run: databricks bundle deploy --target ${{ github.ref_name }}

      - name: Run Hello World Job
        run: |
          JOB_ID=$(databricks jobs list --output json | jq -r '.jobs[] | select(.settings.name == "Hello_World_Job") | .job_id' | head -n 1)
          databricks jobs run-now "$JOB_ID"