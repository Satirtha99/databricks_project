name: Deploy Databricks Bundle

on:
  push:
    branches:
      - dev
      - uat
      - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy DAB to ${{ github.ref_name }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}
    
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: a2ea8b7f-4d91-4ed7-8832-d908d6ebbdde

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target ${{ github.ref_name }}

      - name: Deploy bundle
        run: databricks bundle deploy --target ${{ github.ref_name }}